name = "vror.vi"
format = "vd,vs2,uimm,vm"

[tests]
base = [
    [0x0, 0x0],
    [0x1, 0x2],
    [0x3, 0xf]
]
sew8 = [
    [0x1f, 0x00],
    [0x1,  0xff],
    [0x1,  0x7f],
    [0x1f, 0xff],
    [0x21, 0x12],
    [0x3f, 0x12],
    [0x1f, 0x80]
]
sew16 = [
    [0x1f, 0x0000],
    [0x1,  0xffff],
    [0x1,  0x7fff],
    [0x1f, 0xffff],
    [0x21, 0x1234],
    [0x3f, 0x1234],
    [0x1f, 0x8000]
]
sew32 = [
    [0x1f, 0x00000000],
    [0x1,  0xffffffff],
    [0x1,  0x7fffffff],
    [0x1f, 0xffffffff],
    [0x21, 0x12345678],
    [0x3f, 0x12345678],
    [0x1f, 0x80000000]
]
sew64 = [
    ["0x1f", "0x0000000000000000"],
    ["0x1",  "0xffffffffffffffff"],
    ["0x1",  "0x7fffffffffffffff"],
    ["0x1f", "0xffffffffffffffff"],
    ["0x21", "0x123456789abcdef0"],
    ["0x3f", "0x123456789abcdef0"],
    ["0x30", "0x123456789abcdef0"],
    ["0x1f", "0x8000000000000000"]
]
