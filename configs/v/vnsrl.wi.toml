name = "vnsrl.wi"
format = "vd,vs2,uimm,vm"

[tests]
base = [
    [0x0, 0x0],
    [0x1, 0x2],
    [0x3, 0xf]
]
sew8 = [
    [0x1f, 0x00],
    [0x1,  0xff],
    [0x1,  0x7f],
    [0x1f, 0xff],
    # INT_MIN operands: the asymmetric end of two's complement, -INT_MIN is unrepresentable
    [0x1f, 0x80]
]
sew16 = [
    [0x1f, 0x0000],
    [0x1,  0xffff],
    [0x1,  0x7fff],
    [0x1f, 0xffff],
    [0x1f, 0x8000]
]
sew32 = [
    [0x1f, 0x00000000],
    [0x1,  0xffffffff],
    [0x1,  0x7fffffff],
    [0x1f, 0xffffffff],
    [0x1f, 0x80000000]
]
